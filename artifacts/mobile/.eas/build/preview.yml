build:
  name: Plinko Cash Preview APK
  steps:
    - eas/checkout
    - run:
        name: Install pnpm v10
        command: npm install -g pnpm@10.26.1
    - eas/install_node_modules
    - run:
        name: Prebuild
        command: |
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --non-interactive --skip-dependency-update
    - eas/run_gradle
    - eas/find_and_upload_build_artifacts
